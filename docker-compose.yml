version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: team-management-db
    environment:
      POSTGRES_DB: team_management
      POSTGRES_USER: team_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application (Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-management-app
    environment:
      DATABASE_URL: postgresql://team_user:${DB_PASSWORD:-changeme}@postgres:5432/team_management
      JWT_SECRET: ${JWT_SECRET:-votre_secret_jwt_super_securise_a_changer}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
