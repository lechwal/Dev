# Configuration Render Blueprint
# Ce fichier permet un déploiement automatique sur Render

services:
  # Service Web (Backend + Frontend)
  - type: web
    name: team-management-app
    env: node
    region: frankfurt  # Changez selon votre localisation
    plan: free
    buildCommand: npm run build && cd backend && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true  # Génère automatiquement un secret
      - key: DATABASE_URL
        fromDatabase:
          name: team-management-db
          property: connectionString
      - key: PORT
        value: 3001

databases:
  # Base de données PostgreSQL
  - name: team-management-db
    plan: free
    databaseName: team_management
    user: team_user
